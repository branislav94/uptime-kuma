# Dockge stack: the whole folder goes into the stacks directory, e.g. /opt/stacks/uptime-kuma/
#   compose.yaml
#   .env                 (copy of .env.example, filled in — never committed)
#   sync/Dockerfile
#   sync/kuma_sync.py

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Europe/Belgrade
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  kuma-sync:
    build: ./sync
    image: local/kuma-sync:latest
    restart: unless-stopped
    depends_on:
      uptime-kuma:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - KUMA_URL=http://uptime-kuma:3001
      - TZ=Europe/Belgrade
      - STATE_DIR=/app/state
    volumes:
      # remembers domain/SSL expiry dates and sent alerts (no repeated messages after a restart)
      - ./sync-state:/app/state
